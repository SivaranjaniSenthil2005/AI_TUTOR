# Example Gold Evaluation Set for AI Tutor RAG Evaluation (Phase 11 Conversational Format)
# Supports single-turn questions, multi-turn follow-ups with history, and honest refusal checks.

items:
  - question: "Why do stars twinkle in the night sky?"
    board: "cbse"
    class_level: 10
    subject: "science"
    expected_chapter_no: 10
    expected_chapter_title: "Human Eye and the Colourful World"
    expected_pages: [178, 179]
    notes: "Atmospheric refraction of starlight."

  - question: "What is the function of the human cornea and lens?"
    board: "cbse"
    class_level: 10
    subject: "science"
    expected_chapter_no: 10
    expected_chapter_title: "Human Eye and the Colourful World"
    expected_pages: [176, 177]
    notes: "Eye anatomy and focal adjustment."

  - question: "Explain Newton's second law of motion with mathematical formula."
    board: "tn"
    class_level: 10
    subject: "science"
    expected_chapter_no: 1
    expected_chapter_title: "Laws of Motion"
    expected_pages: [4, 5]
    notes: "Force equals mass times acceleration."

  - question: "What is the difference between power sharing in Belgium and Sri Lanka?"
    board: "cbse"
    class_level: 10
    subject: "social_science"
    expected_chapter_no: 1
    expected_chapter_title: "Power Sharing"
    expected_pages: [2, 3, 4]
    notes: "Majoritarianism vs Accommodation."

  - question: "What were the main causes of the First World War in 1914?"
    board: "tn"
    class_level: 10
    subject: "social_science"
    expected_chapter_no: 1
    expected_chapter_title: "Outbreak of World War I and Its Aftermath"
    expected_pages: [1, 2, 3]
    notes: "Imperial rivalry and European alliances."

  # Conversational follow-up examples (Phase 11)
  - question: "Where does it happen?"
    board: "cbse"
    class_level: 10
    subject: "science"
    history:
      - role: "student"
        text: "What is photosynthesis?"
      - role: "tutor"
        text: "Photosynthesis is the process by which autotrophs take in carbon dioxide and water and convert them into carbohydrates in the presence of sunlight and chlorophyll."
    expected_chapter_no: 5
    expected_chapter_title: "Life Processes"
    notes: "Follow-up pronoun resolution: where photosynthesis happens in chloroplast / leaf."

  - question: "Give an everyday example of it."
    board: "tn"
    class_level: 10
    subject: "science"
    history:
      - role: "student"
        text: "Explain inertia of motion."
      - role: "tutor"
        text: "Inertia of motion is the resistance of any physical object to any change in its velocity or state of motion."
    expected_chapter_no: 1
    expected_chapter_title: "Laws of Motion"
    notes: "Follow-up resolution: example of inertia of motion."

  - question: "What is the capital city of France?"
    board: "cbse"
    class_level: 10
    subject: "science"
    expected_refusal: true
    notes: "Negative refusal check: not in Class 10 Science textbook."
